volumes:
  seopartnerhub_local_postgres_data: {}
  seopartnerhub_local_postgres_data_backups: {}
  seopartnerhub_local_redis_data: {}
  seopartnerhub_local_n8n_data: {}
  seopartnerhub_frontend_starter_node_modules: {}
  seopartnerhub_frontend_starter_next_cache: {}
  seopartnerhub_frontend_full_node_modules: {}
  seopartnerhub_frontend_full_next_cache: {}

services:
  django: &django
    build:
      context: .
      dockerfile: ./compose/local/django/Dockerfile
    image: seopartnerhub_local_django
    container_name: seopartnerhub_local_django
    depends_on:
      - postgres
      - redis
      - mailpit
      - n8n
    volumes:
      - /app/.venv
      - .:/app:z
    env_file:
      - ./.envs/.local/.django
      - ./.envs/.local/.postgres
    environment:
      N8N_BASE_URL: http://n8n:5678
      N8N_WEBHOOK_BASE_URL: http://n8n:5678/webhook
    ports:
      - "8000:8000"
    command: /start

  postgres:
    build:
      context: .
      dockerfile: ./compose/production/postgres/Dockerfile
    image: seopartnerhub_production_postgres
    container_name: seopartnerhub_local_postgres
    volumes:
      - seopartnerhub_local_postgres_data:/var/lib/postgresql/18/docker
      - seopartnerhub_local_postgres_data_backups:/backups
    env_file:
      - ./.envs/.local/.postgres

  mailpit:
    image: docker.io/axllent/mailpit:v1.30.1
    container_name: seopartnerhub_local_mailpit
    ports:
      - "8025:8025"

  redis:
    image: docker.io/redis:7.2
    container_name: seopartnerhub_local_redis
    volumes:
      - seopartnerhub_local_redis_data:/data

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.22.6
    container_name: seopartnerhub_local_n8n
    depends_on:
      - redis
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      NODE_ENV: development
      WEBHOOK_URL: http://localhost:5678/
      GENERIC_TIMEZONE: UTC
      N8N_RUNNERS_ENABLED: "true"
      N8N_ENCRYPTION_KEY: dev-only-change-me-32-bytes-min!!
      DB_TYPE: sqlite
      EXECUTIONS_MODE: regular
      QUEUE_BULL_REDIS_HOST: redis
      QUEUE_BULL_REDIS_PORT: 6379
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
    volumes:
      - seopartnerhub_local_n8n_data:/home/node/.n8n
    ports:
      - "5678:5678"

  celeryworker:
    <<: *django
    image: seopartnerhub_local_celeryworker
    container_name: seopartnerhub_local_celeryworker
    depends_on:
      - redis
      - postgres
      - mailpit
    ports: []
    command: /start-celeryworker

  celerybeat:
    <<: *django
    image: seopartnerhub_local_celerybeat
    container_name: seopartnerhub_local_celerybeat
    depends_on:
      - redis
      - postgres
      - mailpit
    ports: []
    command: /start-celerybeat

  flower:
    <<: *django
    image: seopartnerhub_local_flower
    container_name: seopartnerhub_local_flower
    ports:
      - "5555:5555"
    command: /start-flower


volumes:
  seopartnerhub_local_postgres_data: {}
  seopartnerhub_local_postgres_data_backups: {}
  seopartnerhub_local_redis_data: {}
  seopartnerhub_frontend_starter_node_modules: {}
  seopartnerhub_frontend_starter_next_cache: {}
  seopartnerhub_frontend_full_node_modules: {}
  seopartnerhub_frontend_full_next_cache: {}

services:
  django: &django
    build:
      context: .
      dockerfile: ./compose/local/django/Dockerfile
    image: seopartnerhub_local_django
    container_name: seopartnerhub_local_django
    depends_on:
      - postgres
      - redis
      - mailpit
    volumes:
      - /app/.venv
      - .:/app:z
    env_file:
      - ./.envs/.local/.django
      - ./.envs/.local/.postgres
    ports:
      - "8000:8000"
    command: /start

  postgres:
    build:
      context: .
      dockerfile: ./compose/production/postgres/Dockerfile
    image: seopartnerhub_production_postgres
    container_name: seopartnerhub_local_postgres
    volumes:
      - seopartnerhub_local_postgres_data:/var/lib/postgresql/18/docker
      - seopartnerhub_local_postgres_data_backups:/backups
    env_file:
      - ./.envs/.local/.postgres

  mailpit:
    image: docker.io/axllent/mailpit:latest
    container_name: seopartnerhub_local_mailpit
    ports:
      - "8025:8025"

  redis:
    image: docker.io/redis:8.10
    container_name: seopartnerhub_local_redis
    volumes:
      - seopartnerhub_local_redis_data:/data

  celeryworker:
    <<: *django
    image: seopartnerhub_local_celeryworker
    container_name: seopartnerhub_local_celeryworker
    depends_on:
      - redis
      - postgres
      - mailpit
    ports: []
    command: /start-celeryworker

  celerybeat:
    <<: *django
    image: seopartnerhub_local_celerybeat
    container_name: seopartnerhub_local_celerybeat
    depends_on:
      - redis
      - postgres
      - mailpit
    ports: []
    command: /start-celerybeat

  flower:
    <<: *django
    image: seopartnerhub_local_flower
    container_name: seopartnerhub_local_flower
    ports:
      - "5555:5555"
    command: /start-flower

